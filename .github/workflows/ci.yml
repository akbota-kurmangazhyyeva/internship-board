name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U board -d board_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://board:board@localhost:5432/board_test
      REQUIRE_DB: "1" # integration tests must run in CI, never silently skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://board:board@localhost:5432/board_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (unit + PostgreSQL integration + frozen test-set guard)
        run: pytest -q
      - name: Evaluation scripts smoke test (synthetic example data)
        run: |
          python -m evaluation.validate evaluation/example
          python -m evaluation.eval_extraction --data evaluation/example --no-save
          python -m evaluation.eval_dedup --data evaluation/example --no-save

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api
